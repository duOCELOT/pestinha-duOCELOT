plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// Public development-only key: debug builds use the same signature across CI runs.
// Never use this key for a production/store release.
def debugKey = layout.buildDirectory.file('debug-signing.keystore').get().asFile
debugKey.parentFile.mkdirs()
debugKey.bytes = java.util.Base64.decoder.decode(rootProject.file('debug-signing.keystore.b64').text.trim())

android {
    signingConfigs {
        debug {
            storeFile debugKey
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    namespace 'org.pestinha.android'
    compileSdk 35
    defaultConfig {
        applicationId 'org.pestinha.android'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.3.0-alpha'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            python.srcDir "$buildDir/generated-python"
        }
    }
}

chaquopy {
    defaultConfig {
        version '3.11'
        pip { install 'numpy==1.26.2' }
    }
}

// Package only the headless original modules; Qt and desktop dependencies stay out.
tasks.register('syncBrain', Sync) {
    from('../..') {
        include 'pestinha/__init__.py', 'pestinha/core/__init__.py'
        include 'pestinha/core/nervous_system.py', 'pestinha/core/emotion.py'
        include 'pestinha/core/homeostasis.py', 'pestinha/core/motor.py'
        include 'pestinha/core/conditioning.py', 'pestinha/core/episodic.py', 'pestinha/core/protesto.py'
        include 'pestinha/ajustes.py'
        include 'pestinha/mathutil.py', 'pestinha/store.py', 'pestinha/log.py'
        include 'pestinha/config.py', 'pestinha/paths.py'
    }
    into "$buildDir/generated-python"
}
tasks.named('preBuild').configure { dependsOn 'syncBrain' }
tasks.configureEach {
    if (name.toLowerCase().contains('python') && name != 'syncBrain') {
        dependsOn 'syncBrain'
    }
}

// A narrow generated assets directory avoids treating the entire repository
// (including Gradle outputs) as an input of mergeDebugAssets.
def syncPetAssets = tasks.register('syncPetAssets', Sync) {
    from('../..') { include 'LICENSE', 'pets/bryan.json', 'pets/jorge.json' }
    into layout.buildDirectory.dir('generated-pet-assets')
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated-pet-assets'))
// AGP does not infer this producer dependency from assets.srcDir(TaskProvider).
// Explicitly run the copy before the asset merge on every build variant.
tasks.named('preBuild').configure { dependsOn syncPetAssets }
tasks.configureEach {
    if (name.startsWith('merge') && name.endsWith('Assets')) {
        dependsOn syncPetAssets
    }
}

// A successful compile alone does not guarantee the runtime resources exist.
tasks.register('verifyDebugPayload') {
    dependsOn 'assembleDebug'
    doLast {
        def apk = layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile
        new java.util.zip.ZipFile(apk).withCloseable { zip ->
            ['assets/pets/bryan.json', 'assets/pets/jorge.json', 'assets/LICENSE', 'assets/chaquopy/app.imy'].each { path ->
                if (zip.getEntry(path) == null) {
                    throw new GradleException("Required APK entry missing: $path")
                }
            }
            def pet = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry('assets/pets/bryan.json')))
            if (pet.nome != 'Bryan' || pet.seed != 7) {
                throw new GradleException('Invalid Bryan definition in APK')
            }
            logger.lifecycle('APK payload verified: Bryan definition, license and Python application present')
        }
    }
}
